name: Сборка АРК

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache m4

      - name: Buildozer и зависимости
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install Cython==0.29.36
          pip install buildozer==1.5.0

      - name: Кэш
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: bz-2024stable-v2-${{ hashFiles('buildozer.spec') }}

      - name: Собрать APK
        run: |
          yes | buildozer android debug || buildozer android debug

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: KLEN-APK
          path: bin/*.apk
          if-no-files-found: error
